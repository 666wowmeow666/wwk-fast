name: Unzip archive

on:
  workflow_dispatch:
  push:
    paths:
      - "WWK_FAST_BOTS_AMVERA_READY-1.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip archive
        run: unzip -o WWK_FAST_BOTS_AMVERA_READY-1.zip -d extracted

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Копируем содержимое архива в корень репозитория
          cp -a extracted/. .

          git add .
          git commit -m "Add files from archive" || echo "No changes to commit"
          git push
