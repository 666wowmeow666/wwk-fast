name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wwk
          POSTGRES_PASSWORD: wwk
          POSTGRES_DB: wwk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wwk -d wwk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://wwk:wwk@localhost:5432/wwk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Миграции на пустой базе (alembic upgrade head)
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - name: Тесты (unit + интеграционные на PostgreSQL + сборка ботов)
        run: python -m unittest discover -s tests -v
      - name: Docker build
        run: docker build -t wwk-fast-bots .
